version: '3'

dotenv: ['.env']

vars:
  COMPOSE_FILE: deployments/docker-compose.dev.yml

tasks:
  dev:
    desc: Start PostgreSQL, apply migrations, and launch Go API + React/Vite web together
    cmds:
      - task: db:up
      - task: migrate:up
      - task: dev:servers

  dev:servers:
    internal: true
    deps:
      - dev:api
      - dev:web

  dev:api:
    desc: Run the Go + Echo API server (http://localhost:8080)
    cmds:
      - go run ./cmd/api

  dev:web:
    desc: Run the React + Vite dev server (http://localhost:5173)
    dir: web
    cmds:
      - npm run dev

  db:up:
    desc: Start local PostgreSQL container and wait until healthy
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d --wait

  db:down:
    desc: Stop local PostgreSQL container
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  migrate:up:
    desc: Apply pending Goose database migrations
    cmds:
      - go run ./cmd/migrate -direction=up

  migrate:down:
    desc: Roll back Goose database migrations to version 0
    cmds:
      - go run ./cmd/migrate -direction=down

  test:
    desc: Run all backend (unit + PostgreSQL RLS/auth) and frontend tests
    cmds:
      - task: test:go
      - task: test:web

  test:go:
    desc: Run all Go unit and PostgreSQL RLS/auth integration tests
    cmds:
      - go test -v -count=1 ./...

  test:go:unit:
    desc: Run Go unit tests only (no database required)
    cmds:
      - go test -short -v ./...

  test:web:
    desc: Run frontend Vitest test suite
    dir: web
    cmds:
      - npm test

  lint:
    desc: Run Go vet and frontend ESLint + TypeScript typecheck
    cmds:
      - task: vet
      - task: web:lint
      - task: web:typecheck

  vet:
    desc: Run go vet on backend packages
    cmds:
      - go vet ./...

  build:
    desc: Build Go binaries and frontend production bundle
    cmds:
      - go build ./cmd/api ./cmd/migrate
      - task: web:build

  web:lint:
    desc: Run ESLint in web/
    dir: web
    cmds:
      - npm run lint

  web:typecheck:
    desc: Run TypeScript typecheck in web/
    dir: web
    cmds:
      - npm run typecheck

  web:build:
    desc: Build React/Vite production bundle in web/
    dir: web
    cmds:
      - npm run build
