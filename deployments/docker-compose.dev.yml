services:
  postgres:
    image: postgres:16-alpine
    container_name: tutorgrid-postgres
    environment:
      POSTGRES_DB: tutorgrid
      POSTGRES_USER: tutorgrid_migrator
      POSTGRES_PASSWORD: tutorgrid_migrator_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tutorgrid_pgdata:/var/lib/postgresql/data
      - ./postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorgrid_migrator -d tutorgrid"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    container_name: tutorgrid-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

  nats:
    image: nats:2.10-alpine
    container_name: tutorgrid-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - tutorgrid_natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  tutorgrid_pgdata:
  tutorgrid_natsdata:
