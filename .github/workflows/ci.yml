name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "slice/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Migrations & RLS Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutorgrid_test
          POSTGRES_USER: tutorgrid_migrator
          POSTGRES_PASSWORD: tutorgrid_migrator_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tutorgrid_migrator -d tutorgrid_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Create non-superuser app role
        env:
          PGPASSWORD: tutorgrid_migrator_dev
        run: |
          command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h localhost -U tutorgrid_migrator -d tutorgrid_test -v ON_ERROR_STOP=1 -c "
            CREATE ROLE tutorgrid_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'tutorgrid_app_dev';
            GRANT CONNECT ON DATABASE tutorgrid_test TO tutorgrid_app;
            GRANT USAGE ON SCHEMA public TO tutorgrid_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE tutorgrid_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tutorgrid_app;
          "

      - name: Vet and Build
        run: |
          go vet ./...
          go build ./cmd/tutorgrid ./cmd/migrate

      - name: Verify Migration Up, Rollback & Re-apply
        env:
          TUTORGRID_DATABASE_MIGRATION_URL: postgres://tutorgrid_migrator:tutorgrid_migrator_dev@localhost:5432/tutorgrid_test?sslmode=disable
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate -to 2
          go run ./cmd/migrate

      - name: Unit and PostgreSQL RLS Integration Tests
        env:
          TUTORGRID_TEST_DATABASE_MIGRATION_URL: postgres://tutorgrid_migrator:tutorgrid_migrator_dev@localhost:5432/tutorgrid_test?sslmode=disable
          TUTORGRID_TEST_DATABASE_URL: postgres://tutorgrid_app:tutorgrid_app_dev@localhost:5432/tutorgrid_test?sslmode=disable
        run: go test -p 1 -race -count=1 -v ./...

      - name: Go Vulnerability Check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (Typecheck, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, Lint, and Build Frontend
        working-directory: apps/frontend
        run: |
          bun run typecheck
          bun run lint
          bun run build

  security:
    name: Security (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
