name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "slice/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Lint, Migrations & RLS Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tutorgrid_test
          POSTGRES_USER: tutorgrid_migrator
          POSTGRES_PASSWORD: tutorgrid_migrator_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tutorgrid_migrator -d tutorgrid_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Start NATS JetStream
        run: |
          docker run -d --name tutorgrid-nats -p 4222:4222 -p 8222:8222 nats:2.10-alpine -js -sd /tmp/nats -m 8222
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8222/healthz >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs tutorgrid-nats
          exit 1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Create non-superuser app role
        env:
          PGPASSWORD: tutorgrid_migrator_dev
        run: |
          command -v psql >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          psql -h localhost -U tutorgrid_migrator -d tutorgrid_test -v ON_ERROR_STOP=1 -c "
            CREATE ROLE tutorgrid_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS PASSWORD 'tutorgrid_app_dev';
            GRANT CONNECT ON DATABASE tutorgrid_test TO tutorgrid_app;
            GRANT USAGE ON SCHEMA public TO tutorgrid_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE tutorgrid_migrator IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tutorgrid_app;
          "

      - name: Vet and Build
        run: |
          go vet ./...
          go build ./cmd/tutorgrid ./cmd/migrate

      - name: Verify Migration Up, Rollback & Re-apply
        env:
          TUTORGRID_DATABASE_MIGRATION_URL: postgres://tutorgrid_migrator:tutorgrid_migrator_dev@localhost:5432/tutorgrid_test?sslmode=disable
        run: |
          go run ./cmd/migrate
          go run ./cmd/migrate -to 2
          go run ./cmd/migrate

      - name: Unit, PostgreSQL RLS, NATS JetStream & Opt-In Backblaze B2 Tests
        env:
          TUTORGRID_TEST_DATABASE_MIGRATION_URL: postgres://tutorgrid_migrator:tutorgrid_migrator_dev@localhost:5432/tutorgrid_test?sslmode=disable
          TUTORGRID_TEST_DATABASE_URL: postgres://tutorgrid_app:tutorgrid_app_dev@localhost:5432/tutorgrid_test?sslmode=disable
          TUTORGRID_TEST_NATS_URL: nats://localhost:4222
          # Opt-in real Backblaze B2 test bucket secrets (skipped safely on forked PRs where secrets are unavailable)
          TUTORGRID_TEST_STORAGE_ENDPOINT: ${{ secrets.TUTORGRID_TEST_STORAGE_ENDPOINT }}
          TUTORGRID_TEST_STORAGE_REGION: ${{ secrets.TUTORGRID_TEST_STORAGE_REGION }}
          TUTORGRID_TEST_STORAGE_BUCKET: ${{ secrets.TUTORGRID_TEST_STORAGE_BUCKET }}
          TUTORGRID_TEST_STORAGE_ACCESS_KEY_ID: ${{ secrets.TUTORGRID_TEST_STORAGE_ACCESS_KEY_ID }}
          TUTORGRID_TEST_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.TUTORGRID_TEST_STORAGE_SECRET_ACCESS_KEY }}
        run: go test -p 1 -race -count=1 -v ./...

      - name: Go Vulnerability Check (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (Typecheck, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, Lint, and Build Frontend
        working-directory: apps/frontend
        run: |
          bun run typecheck
          bun run lint
          bun run build

  security:
    name: Security (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
